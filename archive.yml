files:
  - source: "https://github.com/mattn/efm-langserver/archive/refs/tags/v{{version}}.tar.gz"
    kind: "go-vendor"
    tag: "efm-langserver-{{version}}"
    output: "efm-langserver-{{version}}-vendor.tar.xz"
    values:
      - version: "0.0.55"
  - source: "https://github.com/mvdan/gofumpt/archive/refs/tags/v{{version}}.tar.gz"
    kind: "go-vendor"
    tag: "gofumpt-{{version}}"
    output: "gofumpt-{{version}}-vendor.tar.xz"
    values:
      - version: "0.9.2"
  - source: "https://chromium.googlesource.com/chromium/src/third_party/rust/+archive/{{commit}}.tar.gz"
    kind: "download"
    tag: "deno-{{version}}"
    output: "chromium-third-party-rust-{{commit}}.tar.gz"
    values:
      - commit: "30eb036e9b2f181dda31bde6f20d2a4983e380b9"
        version: "2.7.2"
  - source: "https://github.com/radulucut/cleed/archive/refs/tags/v{{version}}.tar.gz"
    kind: "go-vendor"
    tag: "cleed-{{version}}"
    output: "cleed-{{version}}-vendor.tar.xz"
    values:
      - version: "0.4.4"
